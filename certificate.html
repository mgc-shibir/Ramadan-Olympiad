        let sortedData = [];

        function parseTime(str) {
            const m = str.match(/(\d+)m/) || [0,0];
            const s = str.match(/(\d+)s/) || [0,0];
            return (parseInt(m[1]) * 60) + parseInt(s[1]);
        }

        function getGroupName(className) {
            if (["৬ষ্ঠ","৭ম","৮ম","৯ম","১০ম"].some(v => className.includes(v))) return "৬ষ্ঠ-১০ম বা সমমান গ্রুপ";
            if (["একাদশ","দ্বাদশ","১১","১২"].some(v => className.includes(v))) return "১১শ-১২শ বা সমমান গ্রুপ";
            return "অনার্স-মাস্টার্স বা সমমান গ্রুপ";
        }

        function init() {
            sortedData = [...rawData].sort((a, b) => {
                if (parseInt(b.score) !== parseInt(a.score)) return parseInt(b.score) - parseInt(a.score);
                return parseTime(a.duration) - parseTime(b.duration);
            }).map((s, i) => ({ ...s, rank: i + 1 }));

            const body = document.getElementById('leaderboardBody');
            body.innerHTML = sortedData.map(s => `
                <tr onclick="selectStudent('${s.phone}')" class="hover:bg-slate-800 cursor-pointer border-b border-slate-800 transition">
                    <td class="p-4 text-center font-bold text-amber-500">${s.rank}</td>
                    <td class="p-4 font-medium">${s.name}</td>
                    <td class="p-4 text-right font-mono text-xs">${s.score}/${s.total}</td>
                </tr>
            `).join('');
        }

        function searchProfiles() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const popup = document.getElementById('searchPopup');
            if (query.length < 1) { popup.classList.add('hidden'); return; }

            const filtered = sortedData.filter(s => s.name.toLowerCase().includes(query) || s.phone.includes(query));
            if (filtered.length > 0) {
                popup.innerHTML = filtered.map(s => `
                    <div onclick="selectStudent('${s.phone}')" class="p-4 hover:bg-slate-700 border-b border-slate-700 cursor-pointer">
                        <p class="font-bold text-amber-400">${s.name}</p>
                        <p class="text-xs text-slate-400">${s.institution}</p>
                    </div>
                `).join('');
                popup.classList.remove('hidden');
            } else {
                popup.innerHTML = `<div class="p-4 text-slate-500">পাওয়া যায়নি</div>`;
                popup.classList.remove('hidden');
            }
        }

        function selectStudent(phone) {
            const s = sortedData.find(st => st.phone === phone);
            if (!s) return;

            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('previewArea').classList.remove('hidden');
            document.getElementById('searchPopup').classList.add('hidden');
            document.getElementById('searchInput').value = s.name;

            document.getElementById('cName').innerText = s.name;
            const group = getGroupName(s.class);
            const timeStr = s.duration.replace('m', ' মিনিট').replace('s', ' সেকেন্ড');
            
            const descText = `বাংলাদেশ ইসলামি ছাত্রশিবির, মেহেরপুর সরকারি কলেজ শাখা কর্তৃক ১৫-১৮ই রমজান ১৪৪৭ হিজরি তারিখে আয়োজিত রমাদান অলিম্পিয়াড ২০২৬ (অনলাইন) প্রতিযোগিতায় ${s.institution} হতে ${group} হইতে অংশগ্রহণ করিয়াছিলেন। উক্ত প্রতিযোগী ${timeStr} এর মধ্যে পরীক্ষা সম্পন্ন করিয়া ${s.score} মার্ক অর্জন করিয়াছিলেন৷ আরো জানানো হচ্ছে যে, তিনি কৃতিত্বের সহিত উক্ত প্রতিযোগিতায় ${s.rank} তম অবস্থান অধিকার করিয়াছেন। আমরা তাহার অদূর ভবিষ্যতের সাফল্য কামনা করি এবং সুস্বাস্থ্য ও দীর্ঘায়ু কামনা করি।`;
            
            document.getElementById('cDescription').innerText = descText;
            window.scrollTo({ top: document.getElementById('previewArea').offsetTop - 50, behavior: 'smooth' });
        }

        async function downloadPNG() {
            const cert = document.getElementById('certificate-wrapper');
            const canvas = await html2canvas(cert, { scale: 1, useCORS: true });
            const link = document.createElement('a');
            link.download = `Sanad_${document.getElementById('cName').innerText}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        async function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const cert = document.getElementById('certificate-wrapper');
            const canvas = await html2canvas(cert, { scale: 1, useCORS: true });
            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF('l', 'px', [2000, 1414]);
            pdf.addImage(imgData, 'PNG', 0, 0, 2000, 1414);
            pdf.save(`Sanad_${document.getElementById('cName').innerText}.pdf`);
        }

        window.onload = init;
    </script>
