        // ১. ডেটা ক্লিনিং এবং নরমালাইজেশন ফাংশন
        const processData = (list) => {
            return list.map((item, index) => {
                // '13m 5s' কে সেকেন্ডে রূপান্তর
                let totalSeconds = 0;
                const durationStr = item.duration || "0m 0s";
                const mMatch = durationStr.match(/(\d+)m/);
                const sMatch = durationStr.match(/(\d+)s/);
                if (mMatch) totalSeconds += parseInt(mMatch[1]) * 60;
                if (sMatch) totalSeconds += parseInt(sMatch[1]);

                // '47 / 50' থেকে শুধু ৪৭ বের করা
                const scoreValue = parseInt(item.score.split('/')[0]) || 0;

                return {
                    ...item,
                    id: index + 1,
                    numericScore: scoreValue,
                    numericTime: totalSeconds,
                    institution: item.inst || "উল্লেখিত নয়" // inst থেকে institution
                };
            });
        };

        const students = processData(rawStudents);

        // ২. র‍্যাঙ্কিং ক্যালকুলেশন (স্কোর বেশি > সময় কম)
        const sortedStudents = [...students].sort((a, b) => {
            if (b.numericScore !== a.numericScore) return b.numericScore - a.numericScore;
            return a.numericTime - b.numericTime;
        });

        // ৩. গ্রুপ সেকশন লজিক
        const getGroupName = (className) => {
            if (!className) return "সাধারণ গ্রুপ";
            const cls = className.toLowerCase();
            if (cls.includes('৬') || cls.includes('৭') || cls.includes('৮') || cls.includes('৯') || cls.includes('১০') || cls.includes('6') || cls.includes('7') || cls.includes('8') || cls.includes('9') || cls.includes('10')) {
                return "৬ষ্ঠ-১০ম বা সমমান গ্রুপ";
            } else if (cls.includes('১১') || cls.includes('১২') || cls.includes('একাদশ') || cls.includes('দ্বাদশ') || cls.includes('11') || cls.includes('12')) {
                return "১১শ-১২শ বা সমমান গ্রুপ";
            } else if (cls.includes('অনার্স') || cls.includes('মাস্টার্স') || cls.includes('অন্যান্য') || cls.includes('university')) {
                return "অনার্স-মাস্টার্স বা সমমান গ্রুপ";
            }
            return "সাধারণ গ্রুপ";
        };

        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        const certArea = document.getElementById('certArea');
        const loader = document.getElementById('loader');

        let selectedUser = null;

        // ৪. সার্চ ফাংশন
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length < 2) {
                resultsList.classList.add('hidden');
                return;
            }

            const filtered = students.filter(s => 
                s.name.includes(query) || s.phone.includes(query)
            );

            if (filtered.length > 0) {
                resultsList.innerHTML = filtered.map(s => `
                    <div class="px-5 py-4 hover:bg-emerald-50 cursor-pointer transition-colors" onclick="selectUser(${s.id})">
                        <div class="font-bold text-emerald-900">${s.name}</div>
                        <div class="text-sm text-emerald-600">${s.phone} | ${s.institution}</div>
                    </div>
                `).join('');
                resultsList.classList.remove('hidden');
            } else {
                resultsList.innerHTML = `<div class="px-5 py-4 text-gray-400">কোনো তথ্য মেলেনি</div>`;
                resultsList.classList.remove('hidden');
            }
        });

        window.selectUser = (id) => {
            selectedUser = students.find(s => s.id === id);
            resultsList.classList.add('hidden');
            searchInput.value = selectedUser.name;
            
            // র‍্যাঙ্ক খুঁজে বের করা
            const rank = sortedStudents.findIndex(s => s.id === id) + 1;
            renderCertificate(selectedUser, rank);
        };

        const renderCertificate = (user, rank) => {
            const wrapper = document.getElementById('certificate-wrapper');
            const nameEl = document.getElementById('certName');
            const bodyEl = document.getElementById('certBody');
            
            nameEl.innerText = user.name;
            const group = getGroupName(user.class);
            
            bodyEl.innerHTML = `বাংলাদেশ ইসলামি ছাত্রশিবির, মেহেরপুর সরকারি কলেজ শাখা কর্তৃক ১৫-১৮ই রমজান ১৪৪৭ হিজরি তারিখে আয়োজিত রমাদান অলিম্পিয়াড ২০২৬ (অনলাইন) প্রতিযোগিতায় <b>${user.institution}</b> হতে <b>${group}</b> হইতে অংশগ্রহণ করিয়াছিলেন। উক্ত প্রতিযোগী <b>${user.duration}</b> এর মধ্যে পরীক্ষা সম্পন্ন করিয়া <b>${user.numericScore}</b> মার্ক অর্জন করিয়াছিলেন৷ আরো জানানো হচ্ছে যে, তিনি কৃতিত্বের সহিত উক্ত প্রতিযোগিতায় <b>${rank}</b> তম অবস্থান অধিকার করিয়াছেন। আমরা তাহার অদূর ভবিষ্যতের সাফল্য কামনা করি এবং সুস্বাস্থ্য ও দীর্ঘায়ু কামনা করি।`;

            certArea.classList.remove('hidden');
            updatePreview();
        };

        const updatePreview = () => {
            const wrapper = document.getElementById('certificate-wrapper');
            const previewBox = document.getElementById('inner-preview');
            wrapper.style.display = 'block';
            
            html2canvas(wrapper, { useCORS: true, scale: 0.45 }).then(canvas => {
                previewBox.innerHTML = '';
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                canvas.style.objectFit = 'contain';
                previewBox.appendChild(canvas);
                wrapper.style.display = 'none';
            });
        };

        window.downloadImage = () => {
            if(!selectedUser) return;
            loader.style.display = 'flex';
            const wrapper = document.getElementById('certificate-wrapper');
            wrapper.style.display = 'block';

            html2canvas(wrapper, { useCORS: true, scale: 1 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${selectedUser.name}_Ramadan_Olympiad_2026.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
                wrapper.style.display = 'none';
                loader.style.display = 'none';
            });
        };

        window.downloadPDF = () => {
            if(!selectedUser) return;
            loader.style.display = 'flex';
            const wrapper = document.getElementById('certificate-wrapper');
            wrapper.style.display = 'block';

            html2canvas(wrapper, { useCORS: true, scale: 1 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png', 1.0);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('l', 'px', [2000, 1414]);
                pdf.addImage(imgData, 'PNG', 0, 0, 2000, 1414);
                pdf.save(`${selectedUser.name}_Ramadan_Olympiad_2026.pdf`);
                wrapper.style.display = 'none';
                loader.style.display = 'none';
            });
        };
    </script>
