            background-color: #050505;
            color: #e5e7eb;
            overflow-x: hidden;
        }

        .glass-container {

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

            border-color: #fbbf24;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        .rank-top-3 {
            background: linear-gradient(90deg, rgba(251, 191, 36, 0.2), rgba(217, 119, 6, 0.1));
            border-left: 4px solid #fbbf24;
        }
        .rank-4-5 {
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.15), rgba(21, 128, 61, 0.05));
            border-left: 4px solid #22c55e;
        }
        .rank-6-50 {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.15), rgba(29, 78, 216, 0.05));
            border-left: 4px solid #3b82f6;
        }
        .rank-51-plus {
            background: linear-gradient(90deg, rgba(234, 179, 8, 0.1), rgba(161, 98, 7, 0.05));
            border-left: 4px solid #eab308;
        }
        .rank-expelled {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.2), rgba(185, 28, 28, 0.1)) !important;
            border-left: 4px solid #ef4444 !important;
            opacity: 0.8;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .table-auto {
            border-collapse: separate;
            border-spacing: 0 8px;
        }
        
        tr {
            transition: transform 0.2s ease;
        }
        
        tr:hover {
            transform: scale(1.005);
            background: rgba(255, 255, 255, 0.07) !important;
        }

            { name: "মোঃ হাসনাত জামান", class: "অন্যান্য", duration: "2m 57s", inst: "মেহেরপুর সরকারি কলেজ", score: "50 / 50", status: "Normal Submission" }
        ];

        // Function to parse time like "13m 5s" into seconds
        function timeToSeconds(timeStr) {
            let totalSeconds = 0;
            const minutesMatch = timeStr.match(/(\d+)m/);
            const secondsMatch = timeStr.match(/(\d+)s/);
            if (minutesMatch) totalSeconds += parseInt(minutesMatch[1]) * 60;
            if (secondsMatch) totalSeconds += parseInt(secondsMatch[1]);
            return totalSeconds;
        }

        // Clean Score "50 / 50" -> 50
        function cleanScore(scoreStr) {
            return parseInt(scoreStr.split('/')[0].trim());
        }

        // Process Data: Sort by Score (Desc) then Duration (Asc)
        const processedData = rawData
            .map(item => ({
                ...item,
                numScore: cleanScore(item.score),
                numDuration: timeToSeconds(item.duration)
            }))
            .sort((a, b) => {
                if (b.numScore !== a.numScore) return b.numScore - a.numScore;
                return a.numDuration - b.numDuration;
            });

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';
            document.getElementById('totalParticipants').textContent = data.length;

            data.forEach((user, index) => {
                const rank = index + 1;
                let rankDisplay = rank;
                let rowClass = 'rank-51-plus';
                let statusLabel = 'সফল';

                // Assign Styles based on Rank
                if (rank === 1) { rankDisplay = '🥇'; rowClass = 'rank-top-3'; }
                else if (rank === 2) { rankDisplay = '🥈'; rowClass = 'rank-top-3'; }
                else if (rank === 3) { rankDisplay = '🥉'; rowClass = 'rank-top-3'; }
                else if (rank <= 5) { rowClass = 'rank-4-5'; }
                else if (rank <= 50) { rowClass = 'rank-6-50'; }

                // Check for Expelled Status
                if (user.status.toLowerCase().includes('expelled')) {
                    rowClass = 'rank-expelled';
                    rankDisplay = '✘';
                    statusLabel = 'বহিষ্কৃত';
                } else if (user.status === 'Time Up') {
                    statusLabel = 'সময় শেষ';
                }

                const row = `
                    <tr class="${rowClass} border-b border-white/5">
                        <td class="px-4 py-4 font-bold text-lg">${rankDisplay}</td>
                        <td class="px-4 py-4">
                            <div class="font-semibold text-white">${user.name}</div>
                            <div class="text-xs text-gray-400">${user.class}</div>
                        </td>
                        <td class="px-4 py-4 text-gray-300 text-sm">${user.inst}</td>
                        <td class="px-4 py-4 font-bold text-yellow-400">${user.score}</td>
                        <td class="px-4 py-4 text-gray-300 text-sm">${user.duration}</td>
                        <td class="px-4 py-4 text-center">
                            <span class="px-3 py-1 rounded-full text-[10px] uppercase tracking-wider font-bold bg-white/10">
                                ${statusLabel}
                            </span>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const filteredData = processedData.filter(item => 
                item.name.toLowerCase().includes(input) || 
                item.inst.toLowerCase().includes(input)
            );
            renderLeaderboard(filteredData);
        }

        // Initial Load
        window.onload = () => renderLeaderboard(processedData);
    </script>
</body>
</html>
