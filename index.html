<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Islamic Quiz Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'iOSBangla';
            src: url('https://fonts.cdnfonts.com/css/solaimanlipi') format('woff');
        }

        body {
            font-family: 'SolaimanLipi', 'Arial', sans-serif;
            background-color: #000000;
            color: #d1d1d1;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-card {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }

        .input-box {
            background: #151515;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            transition: 0.3s;
        }

        .input-box:focus {
            border-color: #fdbb2d;
            outline: none;
        }

        .option-card {
            display: block;
            background: #111;
            border: 1px solid #222;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        input[type="radio"]:checked + .option-card {
            border-color: #fdbb2d;
            background: rgba(253, 187, 45, 0.1);
            color: #fdbb2d;
        }

        .timer-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
        }

        #cheat-screen, #status-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Time Status Screen (Countdown / Expired) -->
    <div id="status-screen">
        <div class="glass-card p-10 max-w-md w-full">
            <h1 id="status-title" class="text-3xl font-bold text-[#fdbb2d] mb-4">অপেক্ষা করুন</h1>
            <p id="status-msg" class="text-gray-400 mb-6 italic"></p>
            <div id="countdown-timer" class="text-4xl font-mono text-white tracking-widest">00:00:00:00</div>
        </div>
    </div>

    <!-- Cheat Detection Screen -->
    <div id="cheat-screen">
        <h1 class="text-5xl font-bold text-red-600 mb-4">ধরা পড়েছেন!</h1>
        <p class="text-xl text-gray-400">ট্যাব পরিবর্তন করার কারণে আপনার পরীক্ষা বাতিল করা হয়েছে।</p>
    </div>

    <!-- 1. Registration Screen -->
    <div id="reg-screen" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md p-8">
            <h1 class="text-2xl font-bold text-[#fdbb2d] mb-6 text-center">তথ্য প্রদান করুন</h1>
            <form id="reg-form" onsubmit="validateAndStart(event)" class="space-y-4">
                <div>
                    <label class="text-xs text-gray-500 ml-1">আপনার নাম</label>
                    <input type="text" id="u-name" required class="input-box" placeholder="নাম লিখুন">
                </div>
                <div>
                    <label class="text-xs text-gray-500 ml-1">প্রতিষ্ঠানের নাম</label>
                    <input type="text" id="u-inst" required class="input-box" placeholder="স্কুল/কলেজ/মাদ্রাসা">
                </div>
                <div>
                    <label class="text-xs text-gray-500 ml-1">শ্রেণী</label>
                    <select id="u-class" required class="input-box">
                        <option value="">নির্বাচন করুন</option>
                        <option value="৬ষ্ঠ-৮ম">৬ষ্ঠ - ৮ম</option>
                        <option value="৯ম-১০ম">৯ম - ১০ম</option>
                        <option value="একাদশ-দ্বাদশ">একাদশ - দ্বাদশ</option>
                        <option value="অন্যান্য">অন্যান্য</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-500 ml-1">ফোন নম্বর</label>
                    <input type="tel" id="u-phone" required pattern="0[0-9]{10}" class="input-box" placeholder="01XXXXXXXXX">
                </div>
                <div>
                    <label class="text-xs text-gray-500 ml-1">ইমেইল</label>
                    <input type="email" id="u-email" required class="input-box" placeholder="example@mail.com">
                </div>
                <button type="submit" class="w-full bg-[#fdbb2d] text-black font-bold py-3 rounded-lg mt-4 shadow-lg shadow-yellow-900/20">
                    কুইজ শুরু করুন
                </button>
            </form>
        </div>
    </div>

    <!-- 2. Quiz Screen -->
    <div id="quiz-screen" class="hidden">
        <div class="timer-bar p-4 px-6 flex justify-between items-center">
            <div class="text-[#fdbb2d] font-bold text-xl" id="timer">30:00</div>
            <div class="text-sm font-medium" id="live-user"></div>
        </div>
        <div class="max-w-3xl mx-auto p-4 py-10">
            <form id="quiz-form" onsubmit="finalSubmit(event)">
                <div id="questions-area" class="space-y-10"></div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl mt-12 mb-20 transition">
                    ফাইনাল সাবমিট
                </button>
            </form>
        </div>
    </div>

    <!-- 3. Final Result Screen -->
    <div id="result-screen" class="hidden min-h-screen flex items-center justify-center p-4 text-center">
        <div class="glass-card w-full max-w-sm p-10">
            <div class="text-green-500 text-6xl mb-4">✓</div>
            <h2 class="text-2xl font-bold mb-2">সাবমিট হয়েছে!</h2>
            <p class="text-gray-400">অংশগ্রহণের জন্য ধন্যবাদ। ফলাফল পরবর্তীতে জানিয়ে দেয়া হবে।</p>
        </div>
    </div>

    <script>
        const apiKey = "6643cbde-8097-4e6b-ac06-8ab73cd89f03"; // Web3Forms Access Key
        
        // Target Dates
        const START_DATE = new Date("March 4, 2026 00:01:00").getTime();
        const END_DATE = new Date("March 8, 2026 23:59:00").getTime();

        let countdown = 30 * 60;
        let timerTask;
        let testRunning = false;
        let selectedSet = [];

        // Question Database
        const db = [
            {q: "রমজান মাস কত নম্বর হিজরি মাস?", options: ["৭ম", "৮ম", "৯ম", "১০ম"], correct: "৯ম"},
    {q: "রমজান মাসে কোন বই নাযিল হয়?", options: ["তাওরাত", "যবুর", "ইঞ্জিল", "কুরআন"], correct: "কুরআন"},
    {q: "রমজান মাসে মুসলমানরা কী রাখে?", options: ["হজ", "রোজা", "যাকাত", "কুরবানি"], correct: "রোজা"},
    {q: "রোজা রাখার নিয়ত কখন করা হয়?", options: ["রাতে", "দুপুরে", "বিকেলে", "সন্ধ্যায়"], correct: "রাতে"},
    {q: "সেহরি খাওয়া হয় কখন?", options: ["বিকেলে", "রাতে", "ফজরের আগে", "মাগরিবের পরে"], correct: "ফজরের আগে"},
    {q: "ইফতার করা হয় কখন?", options: ["ফজরের সময়", "যোহরের সময়", "আসরের সময়", "মাগরিবের সময়"], correct: "মাগরিবের সময়"},
    {q: "রমজানের সবচেয়ে মর্যাদাপূর্ণ রাত কোনটি?", options: ["শবে বরাত", "শবে কদর", "শবে মেরাজ", "জুমার রাত"], correct: "শবে কদর"},
    {q: "রোজা ফরজ হয়েছে কোন বছরে?", options: ["১ম হিজরি", "২য় হিজরি", "৩য় হিজরি", "৪র্থ হিজরি"], correct: "২য় হিজরি"},
    {q: "রোজা রাখলে কী পাওয়া যায়?", options: ["গুনাহ", "শাস্তি", "সওয়াব", "ক্ষতি"], correct: "সওয়াব"},
    {q: "রমজান কত দিনের মাস?", options: ["২০", "২৫", "২৯ বা ৩০", "৩৫"], correct: "২৯ বা ৩০"},
    {q: "রোজা ভাঙা হয় কী দিয়ে?", options: ["ভাত", "পানি", "খেজুর", "মাংস"], correct: "খেজুর"},
    {q: "রোজা ইসলামের কত নম্বর স্তম্ভ?", options: ["১ম", "২য়", "৩য়", "৪র্থ"], correct: "৪র্থ"},
    {q: "তারাবিহ নামাজ পড়া হয় কোন মাসে?", options: ["শাবান", "রমজান", "জিলহজ", "মহররম"], correct: "রমজান"},
    {q: "তারাবিহ নামাজ কত রাকাত পড়া হয়?", options: ["২", "৪", "৮ বা ২০", "৩০"], correct: "৮ বা ২০"},
    {q: "রোজা রাখার আরবি শব্দ কী?", options: ["সালাত", "সাওম", "যাকাত", "হজ"], correct: "সাওম"},
    {q: "রোজা রাখলে কী নিয়ন্ত্রণ করা শিখি?", options: ["রাগ", "লোভ", "খাওয়া-দাওয়া", "সবগুলো"], correct: "সবগুলো"},
    {q: "ইফতারের সময় কোন দোয়া পড়া হয়?", options: ["খাবারের দোয়া", "রোজা ভাঙার দোয়া", "ঘুমের দোয়া", "সফরের দোয়া"], correct: "রোজা ভাঙার দোয়া"},
    {q: "রমজানের পরে কোন ঈদ আসে?", options: ["ঈদুল আজহা", "ঈদুল ফিতর", "মিলাদ", "শবে বরাত"], correct: "ঈদুল ফিতর"},
    {q: "ফিতরা দেওয়া হয় কোন ঈদের আগে?", options: ["ঈদুল আজহা", "ঈদুল ফিতর", "মিলাদ", "শবে বরাত"], correct: "ঈদুল ফিতর"},
    {q: "রমজান মাসে বেশি কী করা উচিত?", options: ["খেলা", "ঘুম", "ইবাদত", "ভ্রমণ"], correct: "ইবাদত"},
    {q: "রোজা শুরু হয় কোন আজান দিয়ে?", options: ["ফজর", "যোহর", "আসর", "মাগরিব"], correct: "ফজর"},
    {q: "রোজা ভাঙে কোন আজানে?", options: ["ফজর", "যোহর", "আসর", "মাগরিব"], correct: "মাগরিব"},
    {q: "লাইলাতুল কদর কোন দশকে খোঁজা হয়?", options: ["প্রথম", "দ্বিতীয়", "শেষ", "মাঝামাঝি"], correct: "শেষ"},
    {q: "রমজানে কোন নামাজ জামাতে বেশি পড়া হয়?", options: ["তাহাজ্জুদ", "তারাবিহ", "ইশরাক", "চাশত"], correct: "তারাবিহ"},
    {q: "রোজা কার উপর ফরজ?", options: ["ছোট শিশু", "অসুস্থ", "প্রাপ্তবয়স্ক মুসলিম", "ভ্রমণকারী"], correct: "প্রাপ্তবয়স্ক মুসলিম"},
    {q: "রমজান মাস রহমতের মাস বলা হয় কেন?", options: ["বেশি খাবার", "বেশি সওয়াব", "বেশি ঘুম", "বেশি কাজ"], correct: "বেশি সওয়াব"},
    {q: "রোজা রেখে মিথ্যা বললে কী হয়?", options: ["সওয়াব বাড়ে", "গুনাহ হয়", "রোজা মজবুত হয়", "কিছুই না"], correct: "গুনাহ হয়"},
    {q: "সেহরি খাওয়া কী?", options: ["ফরজ", "ওয়াজিব", "সুন্নত", "হারাম"], correct: "সুন্নত"},
    {q: "রমজানে কুরআন খতম করা কী কাজ?", options: ["ভালো কাজ", "খারাপ কাজ", "খেলাধুলা", "নিষেধ"], correct: "ভালো কাজ"},
    {q: "রোজা রাখলে কষ্ট সহ্য করার শিক্ষা হয় কী?", options: ["ধৈর্য", "রাগ", "অলসতা", "ভয়"], correct: "ধৈর্য"},
    {q: "রমজান মাসে শয়তানকে কী করা হয়?", options: ["মুক্ত", "শক্তিশালী", "বন্দি", "রাজা"], correct: "বন্দি"},
    {q: "রোজা রেখে ঝগড়া করা উচিত কি?", options: ["হ্যাঁ", "না", "মাঝে মাঝে", "সব সময়"], correct: "না"},
    {q: "তারাবিহ নামাজ পড়া হয় কোন ওয়াক্তের পর?", options: ["মাগরিব", "ইশা", "ফজর", "যোহর"], correct: "ইশা"},
    {q: "রমজানে দান করলে কী হয়?", options: ["গুনাহ", "ক্ষতি", "সওয়াব", "সমস্যা"], correct: "সওয়াব"},
    {q: "রোজা রেখে গীবত করা কী?", options: ["ভালো", "নিষেধ", "ফরজ", "সুন্নত"], correct: "নিষেধ"},
    {q: "রমজান মাসের শেষ দশ দিন কী বলা হয়?", options: ["রহমত", "মাগফিরাত", "নাজাত", "শাস্তি"], correct: "নাজাত"},
    {q: "ইফতারের সময় আগে কী করা ভালো?", options: ["নামাজ", "দোয়া", "ঘুম", "খেলা"], correct: "দোয়া"},
    {q: "রোজা ইসলামের কতটি স্তম্ভের একটি?", options: ["৩", "৪", "৫", "৬"], correct: "৫"},
    {q: "রমজানে বেশি কোন কাজ করা উচিত?", options: ["কুরআন তিলাওয়াত", "সিনেমা", "ঝগড়া", "আড্ডা"], correct: "কুরআন তিলাওয়াত"},
    {q: "রোজা ভাঙলে কী করতে হয়?", options: ["হাসা", "কাজা রাখা", "ঘুমানো", "খেলা"], correct: "কাজা রাখা"},
    {q: "রমজানে বেশি কী পড়া হয়?", options: ["গল্পের বই", "কুরআন", "পত্রিকা", "উপন্যাস"], correct: "কুরআন"},
    {q: "রোজা রাখার উদ্দেশ্য কী?", options: ["তাকওয়া অর্জন", "মোটা হওয়া", "ঘুমানো", "খেলাধুলা"], correct: "তাকওয়া অর্জন"},
    {q: "লাইলাতুল কদর হাজার কত মাসের চেয়ে উত্তম?", options: ["১০", "৫০", "১০০", "১০০০"], correct: "১০০০"},
    {q: "রমজানে বেশি কোন দোয়া করা উচিত?", options: ["দুনিয়ার", "আখিরাতের", "সব দোয়া", "কোনো দোয়া না"], correct: "সব দোয়া"},
    {q: "রোজা রেখে চুরি করা কী?", options: ["সওয়াব", "গুনাহ", "ফরজ", "সুন্নত"], correct: "গুনাহ"},
    {q: "রমজান মাসে জাহান্নামের দরজা কী হয়?", options: ["খোলা", "বন্ধ", "বড়", "ছোট"], correct: "বন্ধ"},
    {q: "রোজা রেখে নামাজ না পড়া ঠিক কি?", options: ["হ্যাঁ", "না", "কখনো কখনো", "সমস্যা নেই"], correct: "না"},
    {q: "রমজানে বেশি কী চাওয়া উচিত?", options: ["টাকা", "ক্ষমা", "খেলনা", "পোশাক"], correct: "ক্ষমা"},
    {q: "রোজা কার জন্য সহজ নয়?", options: ["ধৈর্যশীল", "অলস", "অসুস্থ", "সৎ"], correct: "অসুস্থ"},

    {q: "রোজা রেখে নামাজ পড়া কী?", options: ["দরকার নেই", "গুরুত্বপূর্ণ", "নিষেধ", "খেলা"], correct: "গুরুত্বপূর্ণ"},
    {q: "রমজানে বেশি কোন কাজ এড়ানো উচিত?", options: ["দান", "নামাজ", "মিথ্যা", "দোয়া"], correct: "মিথ্যা"},
    {q: "রমজান আমাদের কী শিক্ষা দেয়?", options: ["তাকওয়া ও ধৈর্য", "রাগ", "অহংকার", "হিংসা"], correct: "তাকওয়া ও ধৈর্য"}
];
        ];

        function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

        // Time Gating Logic
        function checkAppStatus() {
            const now = new Date().getTime();
            const statusScreen = document.getElementById('status-screen');
            const regScreen = document.getElementById('reg-screen');

            if (now < START_DATE) {
                // Not started yet
                statusScreen.style.display = 'flex';
                updateCountdown(START_DATE, "পরীক্ষা শুরু হতে বাকি:");
                setTimeout(checkAppStatus, 1000);
            } else if (now > END_DATE) {
                // Expired
                statusScreen.style.display = 'flex';
                document.getElementById('status-title').innerText = "সময় শেষ!";
                document.getElementById('status-title').classList.replace('text-[#fdbb2d]', 'text-red-500');
                document.getElementById('status-msg').innerText = "দুঃখিত, কুইজের সময়সীমা পার হয়ে গেছে।";
                document.getElementById('countdown-timer').style.display = 'none';
            } else {
                // Live
                statusScreen.style.display = 'none';
                regScreen.classList.remove('hidden');
            }
        }

        function updateCountdown(target, title) {
            const now = new Date().getTime();
            const diff = target - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('status-msg').innerText = title;
            document.getElementById('countdown-timer').innerText = 
                `${d}d : ${h}h : ${m}m : ${s}s`;
        }

        // Exam Core Logic
        function validateAndStart(e) {
            e.preventDefault();
            document.getElementById('reg-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('live-user').innerText = `পরীক্ষার্থী: ${document.getElementById('u-name').value}`;
            
            testRunning = true;
            setupQuestions();
            startTimer();
            setupAntiCheat();
        }

        function setupQuestions() {
            selectedSet = shuffle([...db]).slice(0, 50);
            const area = document.getElementById('questions-area');
            area.innerHTML = ''; 

            selectedSet.forEach((item, i) => {
                const shuffledOptions = shuffle([...item.options]);
                const qBlock = document.createElement('div');
                qBlock.innerHTML = `
                    <p class="text-lg font-bold text-gray-100 mb-4"><span class="text-[#fdbb2d]">${i+1}.</span> ${item.q}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${shuffledOptions.map(opt => `
                            <label>
                                <input type="radio" name="q${i}" value="${opt}" class="hidden">
                                <span class="option-card">${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                area.appendChild(qBlock);
            });
        }

        function startTimer() {
            timerTask = setInterval(() => {
                countdown--;
                let m = Math.floor(countdown / 60);
                let s = countdown % 60;
                document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if (countdown <= 0) autoEnd("Time Up");
            }, 1000);
        }

        function setupAntiCheat() {
            window.onblur = () => {
                if(testRunning) autoEnd("Cheating Detected");
            };
        }

        function autoEnd(reason) {
            if(!testRunning) return;
            testRunning = false;
            clearInterval(timerTask);
            
            if(reason.includes("Cheating")) {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('cheat-screen').style.display = 'flex';
                submitData(reason);
            } else {
                submitData(reason);
            }
        }

        function finalSubmit(e) {
            e.preventDefault();
            if(!testRunning) return;
            testRunning = false;
            clearInterval(timerTask);
            submitData("User Submitted");
        }

        async function submitData(reason) {
            let score = 0;
            selectedSet.forEach((item, i) => {
                const ans = document.querySelector(`input[name="q${i}"]:checked`)?.value;
                if(ans === item.correct) score++;
            });

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const formData = new FormData();
            formData.append("access_key", apiKey);
            formData.append("subject", `Quiz: ${document.getElementById('u-name').value} (${score}/50)`);
            formData.append("Name", document.getElementById('u-name').value);
            formData.append("Score", score);
            formData.append("Status", reason);

            try {
                await fetch("https://api.web3forms.com/submit", { method: "POST", body: formData });
            } catch (err) {}
        }

        // Run checking on load
        window.onload = checkAppStatus;
    </script>
</body>
