        function timeToSeconds(t) {
            const parts = t.split(' ');
            let sec = 0;
            parts.forEach(p => {
                if(p.includes('m')) sec += parseInt(p) * 60;
                if(p.includes('s')) sec += parseInt(p);
            });
            return sec;

                return timeToSeconds(a.duration) - timeToSeconds(b.duration);
